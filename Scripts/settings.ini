; PBZPlayerArcs 设置
; 可以在游戏外直接改，也可以在游戏内按 F2 调完自动写回本文件。
; 颜色使用 #RRGGBB（sRGB）。数值以 1080p 为基准，按分辨率自动缩放。

; ---- 语言 / 菜单键 ----
; 菜单语言：Scripts\lang 下的语言文件名，也就是游戏的 culture 名（如 zh-Hans、en）
; 留空 = 还没选过；第一次启动时按游戏语言自动填上并写回这里
Lang =
; 菜单键；菜单打开时按 ESC 也可以保存并关闭
MenuKey = F2

; ---- 预设 ----
; 当前预设对应的文件名（不带 .ini），也就是 Scripts\preset\presetN.ini 里的 N；
; 菜单右上角的下拉框显示的是那个文件里 Preset 一行的预设名，改名不影响这里的对应。
Preset = preset1

; ---- 跟随人物 ----
FollowCharacter = true
FollowSmoothing = 0.10
FixedAnchorX = 0.50
FixedAnchorY = 0.55
AnchorHeight = 15
AnchorOffsetX = 0
AnchorOffsetY = 0

; ---- 弧形几何 ----
Radius = 195
Thickness = 12
ArcSpan = 60
Segments = 45
HpOnLeft = true
; 每段笔触的随机偏移：0 = 边缘最干净，数值越大越像手绘但边缘会有细碎毛刺
BrushJitter = 0

; ---- 外观 ----
BarOpacity = 0.75
TrackOpacity = 0.45
GhostOpacity = 0.55
GhostSpeed = 0.35
ShowGhost = true
ShowTip = true
TipScale = 1.8
TipAngle = -15
HpColor = #D6D2C6
QiColor = #D9A62E
TrackColor = #0A0908
WarnColor = #E0301E

; ---- 低量警告（0.30 = 30%）----
WarnThresholdHp = 0.3
WarnThresholdQi = 0.25
WarnFlashSpeed = 1.8
WarnFlashAmount = 0.65

; ---- 显示时机 ----
; Visibility：always = 常态显示，hud = 跟随游戏 HUD 显隐，
;             dynamic = 动态隐藏（血条、杀气条各自计时，满值持续 HideDelay 秒后隐藏该条，
;             未满时跟随 HUD 显隐）
Visibility = dynamic
; HideDelay：动态隐藏延迟（秒），0 = 满了立刻隐藏
HideDelay = 3
; DisplayMode：both = 全部，hp = 仅血条，qi = 仅杀气，off = 弧线都不显示（图标不受影响）
DisplayMode = both

; ---- 药瓶 / 绝招图标 ----
; 药瓶数量取自游戏 HUD；绝招一组是绝招层数和右侧的暗源数量，平铺在屏幕下方；
; F2 菜单打开时：左键按住拖动所有图标，右键按住拖动单个图标，中键恢复默认位置
MedicineHud = true
UltHud = true
; 整组屏幕坐标（1080p 基准像素），-1 = 自动放在屏幕下方中间；拖动后会自动写入
MedicineHudX = -1
MedicineHudY = -1
UltHudX = -1
UltHudY = -1
; 单个图标在组内的偏移（像素），0 = 按顺序自动排列；右键拖动单个图标后自动写入
Med1OffX = 0
Med1OffY = 0
Med2OffX = 0
Med2OffY = 0
Ult1OffX = 0
Ult1OffY = 0
Ult2OffX = 0
Ult2OffY = 0
; 图标整体缩放：1 = 默认大小，0.5 ~ 3；图标、数字和它们之间的间距一起放大，
; 组底边仍停在同一条屏幕线上
IconScale = 1
; 精纯杀气的充能进度直接填充在绝招图标本体上（从下往上）：true = 显示，false = 隐藏
; 攒满一次后进度清零重新积累
UltChargeBar = true

; ---- 原生血条 / 杀气条 ----
; 游戏自己左下角的血条和杀气条会随上限变长；打开后长度固定为游戏最初设定的长度
PinHudBars = true
; 固定长度（以游戏 UI 自身的单位计，日志会打印两条各自的初值）；-1 = 两条各用各自的初值，
; 写成具体数值 = 两条都固定成这个长度
HudBarWidth = -1
; 在原生条上显示「当前值 / 最大值」，不固定条也能打开
HudNumbers = true
; side = 血条上方 / 杀气下方；center = 白字居中在每条条身上
HudNumberStyle = center

; ---- 贴图（一般不用改）----
; 优先使用 InkMaterial；只有材质加载失败时才退回 Texture
InkMaterial = /Game/PBZContent/VFX/SceneFX/UI/Common/M_UI_InkBar_A_002_Inst2.M_UI_InkBar_A_002_Inst2
Texture = /Game/PBZContent/VFX/SceneFX/UI/Common/Assets/T_UI_Common_InkBar_003.T_UI_Common_InkBar_003
TipTexture = /Game/PBZContent/UI/Hud/Art/Hud_Blood_End.Hud_Blood_End

; ---- 笔触接续 ----
; 每段笔触画成多少倍分段长度：数值越大，相邻段重叠越多，弧线越连贯
StrokeOverlap = 9.5

; ---- 调试（写入 Scripts/PBZArcs.log）----
Debug = false
