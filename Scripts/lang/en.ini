; ---- hover hints ----
tip.radius = Arc radius; baseline 1080p, scaled with the resolution
tip.thickness = How thick the ink stroke is
tip.arcSpan = How far the arc opens; larger is closer to a half circle
tip.segments = How many pieces the arc is cut into; fewer looks broken, more is smoother but costs more
tip.brushJitter = Random offset per stroke; 0 is cleanest, higher looks hand-painted
tip.strokeOverlap = How long each stroke copy is; higher overlaps neighbours and joins the arc
tip.anchorHeight = Arc centre height above the character's feet in cm
tip.anchorOffsetX = Horizontal shift from the character; positive moves right
tip.anchorOffsetY = Vertical shift from the character; positive moves down
tip.barOpacity = Opacity of the whole arc, fill and tip
tip.trackOpacity = Opacity of the empty track; 0 draws no track
tip.ghostOpacity = Opacity of the ghost left behind when a value drops
tip.ghostSpeed = Seconds the ghost takes to catch up; smaller is faster
tip.followSmoothing = Seconds the arc takes to follow the character; 0 sticks to it
tip.hpColor = HP arc colour: H hue / S saturation / L lightness; MMB restores the whole colour
tip.qiColor = Sha-Chi arc colour: H hue / S saturation / L lightness; MMB restores the whole colour
tip.warnThresholdHp = HP below this fraction starts flashing a warning
tip.warnThresholdQi = Sha-Chi below this fraction starts flashing a warning
tip.warnFlashSpeed = Warning flashes per second
tip.warnFlashAmount = How far the colour shifts while warning
tip.tipScale = Size of the brush tip at the end of the arc
tip.tipAngle = Rotation of the brush tip against the arc
tip.hideDelay = Seconds a full arc stays up before auto-hiding (dynamic mode)
tip.iconScale = Scales the medicine and ultimate icons, their numbers and gaps

tip.follow = The arc follows the character; off pins it to a fixed screen spot
tip.ghost = When a value drops, the old value fades back down to the new one
tip.tip = Draws a tapering brush tip at the end of the arc
tip.medicine = Shows the medicine count icons from the game HUD
tip.ult = Shows the ultimate stacks and the dark-source count icons
tip.hpLeft = HP on the left and Sha-Chi on the right; off swaps them
tip.visibility = When arcs show: always / follow the game HUD / hide once full
tip.display = Which arcs to draw; hiding arcs keeps the icons
tip.pinBars = Keeps the game's bottom-left HP and Sha-Chi bars at their original length
tip.numbers = Prints current / max on the game's bars, with or without the pin
tip.numStyle = Numbers above / below the bars, or white text centred inside them
tip.preset = Switch presets; each is a full settings file under Scripts/preset, Names can be modified in preset files
tip.presetSave = Store every current setting into the selected preset
tip.presetNew = Create a new preset file from the current settings
tip.reset = Reload the values saved in the current preset, not factory defaults
tip.lang = Menu language, from the files under Scripts/lang
