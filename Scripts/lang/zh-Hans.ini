; PBZPlayerArcs 界面文字（简体中文）
; 菜单里显示的文字都来自这个文件，改完保存后重新按 F2 打开菜单即可生效。
; 等号左边是键名（不要改），右边是显示出来的文字（可以随便改）。
; 下面的 lang.name 是语言下拉框里显示的名字，放在最上面方便找。
lang.name = 简体中文

; ---- 菜单 ----
menu.title = 弧形血条/杀气条
menu.hint = 按住拖动 · 中键恢复预设值 · 图标左键全拖、右键单拖、中键还原 · {menu} / ESC 关闭

; ---- 标签 ----
label.lang = 语言

; ---- 滑条 ----
row.radius = 弧半径
row.thickness = 笔触粗细
row.arcSpan = 弧度范围
row.segments = 分段数量
row.brushJitter = 笔触抖动
row.strokeOverlap = 笔触接续
row.anchorHeight = 人物高度
row.anchorOffsetX = 水平偏移
row.anchorOffsetY = 垂直偏移
row.barOpacity = 整体不透明
row.trackOpacity = 底槽不透明
row.ghostOpacity = 残影不透明
row.ghostSpeed = 残影回收
row.followSmoothing = 跟随平滑
row.tipScale = 笔锋大小
row.hpColorH = 血量 H
row.hpColorS = 血量 S
row.hpColorL = 血量 亮度
row.qiColorH = 杀气 H
row.qiColorS = 杀气 S
row.qiColorL = 杀气 亮度
row.warnThresholdHp = 低血量阈值
row.warnThresholdQi = 低杀气阈值
row.warnFlashSpeed = 闪烁速度
row.warnFlashAmount = 闪烁幅度
row.tipAngle = 笔锋角度
row.hideDelay = 隐藏延迟
row.iconScale = 图标大小

; ---- 按钮 ----
btn.followOn = 跟随人物
btn.followOff = 固定位置
btn.ghostOn = 显示残影
btn.ghostOff = 无残影
btn.tipOn = 显示笔锋
btn.tipOff = 无笔锋
btn.medicineOn = 显示药瓶
btn.medicineOff = 隐藏药瓶
btn.ultOn = 显示绝招
btn.ultOff = 隐藏绝招
btn.visibilityHud = 跟随HUD
btn.visibilityDynamic = 动态隐藏
btn.hpLeftOn = 左血条右杀气
btn.hpLeftOff = 左杀气右血条
btn.displayBoth = 全部显示
btn.displayHp = 仅血条
btn.displayQi = 仅杀气
btn.displayOff = 关闭弧形条
btn.pinBarsOn = 原生条固定长度
btn.pinBarsOff = 原生条动态长度
btn.numbersOn = 显示数字
btn.numbersOff = 隐藏数字
btn.numStyleSide = 上下显示
btn.numStyleCenter = 居中显示
btn.reset = 恢复默认
btn.presetSave = 保存
btn.presetNew = 新建

; ---- 悬浮提示 ----
tip.radius = 弧线半径；基准 1080p，按分辨率自动缩放
tip.thickness = 笔触的粗细
tip.arcSpan = 弧线张开的角度，越大越接近半圆
tip.segments = 弧线分成多少段；越少越有断笔感，越多越顺滑也更耗性能
tip.brushJitter = 每段笔触的随机偏移；0 最干净，越大越像手绘
tip.strokeOverlap = 每段笔触画多长；越大相邻段重叠越多、弧线越连贯
tip.anchorHeight = 弧心在人物脚底上方的高度（厘米）
tip.anchorOffsetX = 弧心相对人物的水平偏移，正值向右
tip.anchorOffsetY = 弧心相对人物的垂直偏移，正值向下
tip.barOpacity = 整条弧线（填充和笔锋）的不透明度
tip.trackOpacity = 弧线底槽的不透明度；0 = 不画底槽
tip.ghostOpacity = 数值掉落时残影的不透明度
tip.ghostSpeed = 残影回收到当前值的时间（秒），越小越快
tip.followSmoothing = 弧线追上人物的平滑时间（秒）；0 = 完全跟手
tip.hpColor = 血量弧的颜色：H 色相 / S 饱和度 / L 亮度，中键恢复整种颜色
tip.qiColor = 杀气弧的颜色：H 色相 / S 饱和度 / L 亮度，中键恢复整种颜色
tip.warnThresholdHp = 血量低于这个比例时开始闪烁警告
tip.warnThresholdQi = 杀气低于这个比例时开始闪烁警告
tip.warnFlashSpeed = 低量警告每秒闪烁几次
tip.warnFlashAmount = 低量警告时颜色变化的幅度
tip.tipScale = 弧线末端笔锋的大小
tip.tipAngle = 笔锋相对弧线的旋转角度
tip.hideDelay = 满值后连续保持几秒才自动隐藏（动态隐藏模式）
tip.iconScale = 药瓶、绝招图标及其数字与间距的整体缩放

tip.follow = 弧线跟随人物移动；关闭后固定在屏幕上的相对位置
tip.ghost = 数值下降时，残留的旧值慢慢回收到当前值
tip.tip = 弧线末端显示一笔渐细的笔锋
tip.medicine = 显示游戏 HUD 里的药瓶数量图标
tip.ult = 显示绝招层数和右侧暗源数量图标
tip.hpLeft = 血条在左、杀气在右；关闭则左右互换
tip.visibility = 弧线何时显示：跟随游戏 HUD / 满值后自动隐藏
tip.display = 画哪些弧线；关闭弧线不影响药瓶和图标
tip.pinBars = 把游戏左下角原生血条、杀气条固定在初始长度，不随上限变长
tip.numbers = 在原生血条和杀气条上显示「当前值 / 最大值」
tip.numStyle = 数字画在条外上方/下方，或白字居中画在条身里
tip.preset = 切换预设；每个预设是 Scripts/preset 下的一个完整设置文件，名称可以在预设文件里修改
tip.presetSave = 把当前所有设置保存到选中的预设
tip.presetNew = 用当前设置新建一个预设文件
tip.reset = 恢复成当前预设里保存的值，不是出厂默认
tip.lang = 菜单显示语言，来自 Scripts/lang 下的语言文件
