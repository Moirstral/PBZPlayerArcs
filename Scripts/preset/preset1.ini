; PBZPlayerArcs 预设 1 —— 默认预设
;
; 出厂状态下这个文件刻意不存任何设置值：它的每一项都等于
; Scripts/PBZArcsConfig.lua 里 FIELDS 定义的默认值，预设没必要再复制一份，
; 也避免以后改了默认值却忘了同步这里。
; settings.ini 是例外：那份必须写全键，好让玩家在配置界面打不开时直接编辑，
; 由 tools/check_config.py 保证它与 FIELDS 逐键一致。
; 所有预设都以 FIELDS 默认值为基地：先用默认值打底，再用本文件里
; 写出的键覆盖。因此在菜单里选中本预设就等于「恢复默认」。
;
; Lang / MenuKey / Preset 属于玩家级配置，只存在 settings.ini 里：
; 切换或保存预设都不会改动它们，本文件里若有 Lang、MenuKey 行也会被忽略。
; Preset 这一行例外地保留，但它是本预设的显示名，不是「当前选中的预设」。
;
; 玩家手动在本文件里写过设置键，或在配置界面点了「保存到预设 1」之后，
; 保存时也只写与默认值不同的键，不会铺开成全量清单（玩家级配置除外）；
; 写出的键一律优先于默认值，没写出的键才取默认值 —— 玩家的改动永远优先。
; 想回到出厂状态，把设置键删掉、只留下面 Preset 这一行即可。
;
; Preset 一行是本预设在菜单下拉框里显示的名字，可以自行改名；
; settings.ini 认的是文件名 preset1，改名不会影响对应关系。
Preset = 预设 1
