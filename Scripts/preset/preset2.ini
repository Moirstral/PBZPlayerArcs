; PBZPlayerArcs 预设 2 —— 出厂示例预设
;
; 出厂状态下本文件只写与默认预设（FIELDS）不同的键，不再复制一整份默认值清单，
; 免得以后改了默认值却忘了同步这里。默认值见 预设 1 与
; Scripts/PBZArcsConfig.lua 的 FIELDS。
; 所有预设都以 FIELDS 默认值为基地：未写出的键取默认值，写出的键覆盖默认值，
; 因此切换预设不会继承上一个预设的残留值。
; 在游戏里点「保存到预设 2」只会把「与默认值不同」的外观 / 行为键写进本文件，
; 改回默认值的键会自动从文件里消失，此后以文件内容为准。
;
; Lang / MenuKey / Preset 属于玩家级配置，只存在 settings.ini 里：
; 切换或保存预设都不会改动它们，本文件里若有 Lang、MenuKey 行也会被忽略。
;
; Preset 一行是本预设在菜单下拉框里显示的名字，可以自行改名；
; settings.ini 认的是文件名 preset2，改名不会影响对应关系。
Preset = 预设 2

; ---- 与默认预设的差异：略小、更张开的一道弧 ----
Radius = 180
Thickness = 10
ArcSpan = 68
Segments = 30
StrokeOverlap = 7

; ---- 条身更实，不画残影 ----
BarOpacity = 1
GhostOpacity = 0.25
ShowGhost = false
TipScale = 2

; hud = 完全跟随游戏 HUD 显隐（默认 dynamic = 满值持续 HideDelay 秒后隐藏）
Visibility = hud
